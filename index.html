<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NextGen Weather UI - Custom OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>

    <!-- Menu Toggle -->
    <button class="menu-toggle-btn" id="menuToggle" onclick="toggleMenu()">
        <span class="material-symbols-outlined">tune</span>
    </button>

    <!-- Controls Panel -->
    <div class="controls-panel" id="controlsPanel">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-white text-lg font-semibold">Configuration</h2>
        <button onclick="toggleMenu()" class="text-gray-400 hover:text-white">
            <span class="material-symbols-outlined">close</span>
        </button>
      </div>

      <!-- Device Section -->
      <div class="section-title">
          Target Device
      </div>
      <div class="device-selector">
          <button class="device-btn active" onclick="setDevice('mobile', this)">
            <span class="material-symbols-outlined">smartphone</span>
            <div>Mobile</div>
          </button>
          <button class="device-btn" onclick="setDevice('desktop', this)">
            <span class="material-symbols-outlined">monitor</span>
            <div>Desktop</div>
          </button>
          <button class="device-btn" onclick="setDevice('watch', this)">
            <span class="material-symbols-outlined">watch</span>
            <div>Watch</div>
          </button>
          <button class="device-btn" onclick="setDevice('car', this)">
            <span class="material-symbols-outlined">directions_car</span>
            <div>Auto</div>
          </button>
      </div>

      <!-- Atmosphere Section -->
      <div class="section-title">Atmosphere Mode</div>
      <button class="control-btn active" onclick="setWeather('sunny', this)">
        <span class="material-symbols-outlined text-yellow-400">wb_sunny</span>
        Sun Mode
      </button>
      <button class="control-btn" onclick="setWeather('rain', this)">
        <span class="material-symbols-outlined text-blue-400">rainy</span>
        Raining
      </button>
      <button class="control-btn" onclick="setWeather('snow', this)">
        <span class="material-symbols-outlined text-white">ac_unit</span>
        Snowing
      </button>
      <button class="control-btn" onclick="setWeather('fog', this)">
        <span class="material-symbols-outlined text-gray-400">foggy</span>
        Foggy
      </button>

      <!-- Sliders -->
      <div id="sunSliderContainer" class="transition-all duration-300 ease-in-out overflow-hidden max-h-0 opacity-0 mb-2">
        <div class="mt-4 pt-4 border-t border-gray-700">
          <label class="flex justify-between text-xs font-bold text-gray-400 uppercase tracking-widest mb-2">
            Sun Intensity <span id="sunVal" class="text-white">1x</span>
          </label>
          <input type="range" min="0" max="3" step="0.2" value="1" class="w-full h-1 bg-gray-600 rounded-lg appearance-none cursor-pointer accent-yellow-400" oninput="setSunIntensity(this.value)" />
        </div>
      </div>

      <div id="rainSliderContainer" class="transition-all duration-300 ease-in-out overflow-hidden max-h-0 opacity-0 mb-2">
        <div class="mt-4 pt-4 border-t border-gray-700">
          <label class="flex justify-between text-xs font-bold text-gray-400 uppercase tracking-widest mb-2">
            Rain Intensity <span id="rainVal" class="text-white">1x</span>
          </label>
          <input type="range" min="0.2" max="4" step="0.2" value="1" class="w-full h-1 bg-gray-600 rounded-lg appearance-none cursor-pointer accent-blue-400" oninput="setRainIntensity(this.value)" />
        </div>
        <div class="mt-4 pt-4 border-t border-gray-700">
           <label class="flex justify-between text-xs font-bold text-gray-400 uppercase tracking-widest mb-2">
            Lightning Freq. <span id="lightningVal" class="text-white">0%</span>
          </label>
          <input type="range" min="0" max="1" step="0.1" value="0" class="w-full h-1 bg-gray-600 rounded-lg appearance-none cursor-pointer accent-purple-400" oninput="setLightningIntensity(this.value)" />
        </div>
      </div>

      <div id="snowSliderContainer" class="transition-all duration-300 ease-in-out overflow-hidden max-h-0 opacity-0 mb-2">
        <div class="mt-4 pt-4 border-t border-gray-700">
          <label class="flex justify-between text-xs font-bold text-gray-400 uppercase tracking-widest mb-2">
            Frost/Snow Level <span id="snowVal" class="text-white">1x</span>
          </label>
          <input type="range" min="0.2" max="3" step="0.1" value="1" class="w-full h-1 bg-gray-600 rounded-lg appearance-none cursor-pointer accent-white" oninput="setSnowIntensity(this.value)" />
        </div>
      </div>

      <div id="fogSliderContainer" class="transition-all duration-300 ease-in-out overflow-hidden max-h-0 opacity-0 mb-2">
        <div class="mt-4 pt-4 border-t border-gray-700">
            <label class="flex justify-between text-xs font-bold text-gray-400 uppercase tracking-widest mb-2">
            Fog Density <span id="fogVal" class="text-white">1x</span>
            </label>
            <input type="range" min="0" max="3" step="0.1" value="1" class="w-full h-1 bg-gray-600 rounded-lg appearance-none cursor-pointer accent-gray-400" oninput="setFogIntensity(this.value)" />
        </div>
      </div>
    </div>

    <!-- MAIN DEVICE CONTAINER -->
    <div id="deviceFrame" class="mobile">
      <div class="hw-btn btn-l-1"></div>
      <div class="hw-btn btn-l-2"></div>
      <div class="hw-btn btn-r"></div>

      <div class="screen" id="phoneScreen">
        <div class="wallpaper-container">
          <img
            id="bg-sunny"
            class="wallpaper active"
            src="https://images.pexels.com/photos/803975/pexels-photo-803975.jpeg?cs=srgb&dl=pexels-fariphotography-803975.jpg&fm=jpg"
            alt="Sunny"
          />
        </div>

        <div id="fsCanvasContainer"></div>

        <div id="sunRays" class="sun-rays active"></div>
        <div id="sunFilter" class="sun-filter active"></div>

        <canvas id="weatherCanvas" width="390" height="800"></canvas>

        <div class="home-view">
          <div class="app-grid" id="appGrid"></div>

          <div class="dock-container" id="dockContainer">
              <!-- Content Injected via JS -->
          </div>
        </div>

        <div id="lightningFlash"></div>

        <div class="status-bar" id="statusBar">
          <!-- Content Injected via JS -->
        </div>
      </div>
    </div>

    <script src="main.js"></script>
  </body>
</html>
